<div *ngIf="isLoggedIn()">
  <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<div class="form-group mt-3 mb-3">
  <label for="tripSearch">Search Trips:</label>

  <input
    id="tripSearch"
    type="text"
    class="form-control"
    placeholder="Search by name, code, or resort"
    #searchInput
    (input)="searchTrips(searchInput.value)">
</div>

<div *ngIf="searchTerm && trips.length === 0" class="alert alert-info">
  No trips match your search.
</div>

<div class="row">
  <div *ngFor="let trip of trips" class="col-md-4">
    <app-trip-card
      [trip]="trip"
      class="card-deck mt-2">
    </app-trip-card>
  </div>
</div>
